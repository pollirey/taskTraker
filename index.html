<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="task.js" defer></script>
    <script src="task-manager.js" defer></script>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <h1 class="logo">Task tracker</h1>
            <nav class="nav">
                <a href="index.html" class="nav__link nav__link--active">Задачи</a>
                <a href="statistics.html" class="nav__link">Статистика</a>
            </nav>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <section class="task-form">
                <h2 class="section-title">Новая задача</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Название задачи</label>
                        <input type="text" id="taskTitle" required placeholder="Введите задачу">
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">Категория</label>
                        <select id="taskCategory">
                            <option value="Учеба">Учеба</option>
                            <option value="Работа">Работа</option>
                            <option value="Личное">Личное</option>
                        </select>
                    </div>
                    <button class="button" type="submit">Добавить задачу</button>
                </form>
            </section>
            <section class="tasks">
                <div class="tasks__header">
                    <h2 class="section-title">Мои задачи</h2>
                    <div class="filters">
                        <button class="filter filter--active" data-filter="all">Все</button>
                        <button class="filter" data-filter="active">В процессе</button>
                        <button class="filter" data-filter="completed">Выполненные</button>
                    </div>
                </div>
                <div id="tasksList" class="tasks-list">
                </div>
            </section>
        </div>
    </main>
</body>
</html>
